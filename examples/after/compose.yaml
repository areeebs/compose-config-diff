services:
  web:
    image: nginx:1.27
    ports:
      - "127.0.0.1:8081:80"
    environment:
      APP_MODE: demo
      API_TOKEN: fake-after-value
      LOG_LEVEL: info

  db:
    image: postgres:16-alpine
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  database:
